name: dual-wan-pcc

topology:
  kinds:
    mikrotik_chr:
      image: mikrotik/chr:7.24.5
    linux:
      image: ghcr.io/srl-labs/network-multitool:latest

  nodes:
    gw:
      kind: mikrotik_chr
      startup-config: gw.rsc
    isp1:
      kind: mikrotik_chr
      startup-config: isp1.rsc
    isp2:
      kind: mikrotik_chr
      startup-config: isp2.rsc
    web:
      kind: linux
      exec:
        - ip addr add 100.64.1.2/30 dev eth1
        - ip addr add 100.64.2.2/30 dev eth2
        - ip addr add 203.0.113.10/32 dev lo
        - ip route add 10.1.0.0/30 via 100.64.1.1
        - ip route add 10.2.0.0/30 via 100.64.2.1
    pc1:
      kind: linux
      exec:
        - ip addr add 192.168.88.10/24 dev eth1
        - ip route add 203.0.113.10/32 via 192.168.88.1

  links:
    - endpoints: ["gw:ether2", "isp1:ether2"]
    - endpoints: ["gw:ether3", "isp2:ether2"]
    - endpoints: ["gw:ether4", "pc1:eth1"]
    - endpoints: ["isp1:ether3", "web:eth1"]
    - endpoints: ["isp2:ether3", "web:eth2"]
