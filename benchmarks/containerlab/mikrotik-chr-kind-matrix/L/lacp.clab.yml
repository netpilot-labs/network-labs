name: lacp
topology:
  kinds:
    mikrotik_chr:
      image: mikrotik/chr:${CHR_TAG:=7.24.5}
  nodes:
    c1:
      kind: mikrotik_chr
      startup-config: |
        /interface bonding add name=bond1 mode=802.3ad slaves=ether2,ether3 lacp-rate=1sec
        /interface bonding add name=bond2 mode=802.3ad slaves=ether4,ether5 lacp-rate=1sec
        /ip address add address=10.1.0.1/24 interface=bond1
        /ip address add address=10.2.0.1/24 interface=bond2
    c2:
      kind: mikrotik_chr
      startup-config: |
        /interface bonding add name=bond2 mode=802.3ad slaves=ether2,ether3 lacp-rate=1sec
        /ip address add address=10.2.0.2/24 interface=bond2
    l1:
      kind: linux
      image: bondpeer:1
      exec:
        - ip link add bond0 type bond mode 802.3ad lacp_rate fast miimon 100
        - ip link set eth1 down
        - ip link set eth1 master bond0
        - ip link set eth2 down
        - ip link set eth2 master bond0
        - ip link set bond0 up
        - ip addr add 10.1.0.2/24 dev bond0
  links:
    - endpoints: ["c1:ether2", "l1:eth1"]
    - endpoints: ["c1:ether3", "l1:eth2"]
    - endpoints: ["c1:ether4", "c2:ether2"]
    - endpoints: ["c1:ether5", "c2:ether3"]
