hostname sw2
!
username admin privilege 15 role network-admin secret admin
!
ip routing
!
interface Ethernet1
   no switchport
   ip address 10.0.12.1/31
!
interface Ethernet2
   no switchport
   ip address 10.2.2.1/24
!
interface Loopback0
   ip address 10.255.0.2/32
!
router bgp 65002
   router-id 10.255.0.2
   neighbor 10.0.12.0 remote-as 65001
   network 10.2.2.0/24
   network 10.255.0.2/32
!
management api http-commands
   no shutdown
!
end
