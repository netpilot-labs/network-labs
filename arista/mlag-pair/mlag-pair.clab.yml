name: arista-mlag
topology:
  kinds:
    arista_ceos:
      image: ceos:4.36.1F
    linux:
      image: ghcr.io/srl-labs/network-multitool:latest
  nodes:
    leaf1:
      kind: arista_ceos
      startup-config: configs/leaf1.cfg
    leaf2:
      kind: arista_ceos
      startup-config: configs/leaf2.cfg
    sw3:
      kind: arista_ceos
      startup-config: configs/sw3.cfg
    h1:
      kind: linux
      exec:
        - ip link add bond0 type bond mode 802.3ad lacp_rate fast miimon 100
        - ip link set eth1 down
        - ip link set eth2 down
        - ip link set eth1 mtu 1500
        - ip link set eth2 mtu 1500
        - ip link set eth1 master bond0
        - ip link set eth2 master bond0
        - ip link set bond0 up
        - ip addr add 10.10.10.10/24 dev bond0
        - ip route replace 10.20.20.0/24 via 10.10.10.1
    h2:
      kind: linux
      exec:
        - ip link set eth1 mtu 1500
        - ip addr add 10.20.20.10/24 dev eth1
        - ip route replace 10.10.10.0/24 via 10.20.20.1
  links:
    - endpoints: ["leaf1:eth1", "leaf2:eth1"]
    - endpoints: ["leaf1:eth2", "leaf2:eth2"]
    - endpoints: ["leaf1:eth3", "h1:eth1"]
    - endpoints: ["leaf2:eth3", "h1:eth2"]
    - endpoints: ["leaf1:eth4", "sw3:eth1"]
    - endpoints: ["leaf2:eth4", "sw3:eth2"]
    - endpoints: ["sw3:eth3", "h2:eth1"]
