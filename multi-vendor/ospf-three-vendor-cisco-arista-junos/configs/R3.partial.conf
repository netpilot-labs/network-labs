system {
 host-name R3;
 root-authentication { plain-text-password-value "<set-a-password>"; }
 services { ssh { root-login allow; } }
}
interfaces {
 eth1 {
  mtu 1500;
  unit 0 {
   family inet { address 10.0.23.2/30; }
  }
 }
 lo0 {
  unit 0 {
   family inet { address 3.3.3.3/32; }
  }
 }
}
routing-options {
 router-id 3.3.3.3;
}
protocols {
 ospf {
  area 0.0.0.0 {
   interface eth1 { interface-type p2p; }
   interface lo0.0 { passive; }
  }
 }
}
