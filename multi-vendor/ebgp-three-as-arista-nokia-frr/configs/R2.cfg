set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 address 10.1.2.2/30
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/2 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 address 10.2.3.1/30
set / interface ethernet-1/2 subinterface 0 ipv4 admin-state enable
set / interface system0 admin-state enable
set / interface system0 subinterface 0 ipv4 address 2.2.2.2/32
set / interface system0 subinterface 0 ipv4 admin-state enable
set / network-instance default interface ethernet-1/1.0
set / network-instance default interface ethernet-1/2.0
set / network-instance default interface system0.0
set / routing-policy prefix-set LOOPBACK prefix 2.2.2.2/32 mask-length-range exact
set / routing-policy policy EXPORT-LO statement 10 match prefix prefix-set LOOPBACK
set / routing-policy policy EXPORT-LO statement 10 action policy-result accept
set / routing-policy policy EXPORT-LO statement 20 match protocol bgp
set / routing-policy policy EXPORT-LO statement 20 action policy-result accept
set / routing-policy policy EXPORT-LO default-action policy-result reject
set / routing-policy policy ACCEPT-ALL default-action policy-result accept
set / network-instance default protocols bgp admin-state enable
set / network-instance default protocols bgp autonomous-system 65002
set / network-instance default protocols bgp router-id 2.2.2.2
set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group EBGP afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group EBGP import-policy [ ACCEPT-ALL ]
set / network-instance default protocols bgp group EBGP export-policy [ EXPORT-LO ]
set / network-instance default protocols bgp neighbor 10.1.2.1 peer-group EBGP
set / network-instance default protocols bgp neighbor 10.1.2.1 peer-as 65001
set / network-instance default protocols bgp neighbor 10.2.3.2 peer-group EBGP
set / network-instance default protocols bgp neighbor 10.2.3.2 peer-as 65003
