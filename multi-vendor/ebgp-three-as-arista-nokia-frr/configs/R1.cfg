hostname R1
username admin privilege 15 role network-admin secret admin
ip routing
!
interface Ethernet1/1
   no switchport
   ip address 10.1.2.1/30
!
interface Loopback0
   ip address 1.1.1.1/32
!
router bgp 65001
   router-id 1.1.1.1
   neighbor 10.1.2.2 remote-as 65002
   network 1.1.1.1/32
!
end
