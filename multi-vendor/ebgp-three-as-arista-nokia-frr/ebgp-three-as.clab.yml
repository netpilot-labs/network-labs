name: ebgp-three-as
topology:
  nodes:
    R1:
      kind: arista_ceos
      image: ceos:4.36.1F
      startup-config: configs/R1.cfg
    R2:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:latest
      startup-config: configs/R2.cfg
    R3:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - ip link set dev eth1 mtu 1500
  links:
    - endpoints: ["R1:eth1_1", "R2:e1-1"]
    - endpoints: ["R2:e1-2", "R3:eth1"]
