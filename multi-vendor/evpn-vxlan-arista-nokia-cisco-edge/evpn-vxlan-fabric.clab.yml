name: evpn-vxlan-fabric
topology:
  nodes:
    spine1:
      kind: arista_ceos
      image: ceos:4.36.1F
      startup-config: configs/spine1.txt.partial
    spine2:
      kind: arista_ceos
      image: ceos:4.36.1F
      startup-config: configs/spine2.txt.partial
    leaf1:
      kind: arista_ceos
      image: ceos:4.36.1F
      startup-config: configs/leaf1.txt.partial
    leaf2:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:25.10.1
      startup-config: configs/leaf2.txt.partial
    wan1:
      kind: cisco_iol
      image: vrnetlab/cisco_iol:17.12.1
      startup-config: configs/wan1.txt.partial
    host1:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      exec:
      - ip link set eth1 mtu 1500
      - ip addr add 10.10.10.11/24 dev eth1
      - ip route add 203.0.113.0/24 via 10.10.10.1
      - ip route add 172.16.0.0/12 via 10.10.10.1
    host2:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      exec:
      - ip link set eth1 mtu 1500
      - ip addr add 10.10.10.12/24 dev eth1
      - ip route add 203.0.113.0/24 via 10.10.10.1
      - ip route add 172.16.0.0/12 via 10.10.10.1
  links:
    - endpoints: ["spine1:eth1_1", "leaf1:eth1_1"]
    - endpoints: ["spine1:eth1_2", "leaf2:ethernet-1/1"]
    - endpoints: ["spine2:eth1_1", "leaf1:eth1_2"]
    - endpoints: ["spine2:eth1_2", "leaf2:ethernet-1/2"]
    - endpoints: ["leaf1:eth1_3", "host1:eth1"]
    - endpoints: ["leaf2:ethernet-1/3", "host2:eth1"]
    - endpoints: ["leaf1:eth1_4", "wan1:Ethernet0/1"]
