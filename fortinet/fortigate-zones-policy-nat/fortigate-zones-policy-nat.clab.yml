name: fortigate-zones-policy-nat
topology:
  nodes:
    FGT1:
      kind: fortinet_fortigate
      image: vrnetlab/vr-fortios:7.0.9
      startup-config: FGT1.txt.partial
    PC1:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      exec:
      - ip addr add 192.168.10.10/24 dev eth1
      - ip link set eth1 mtu 1500
      - ip route add 203.0.113.0/24 via 192.168.10.1
    WEB1:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      exec:
      - ip addr add 203.0.113.10/24 dev eth1
      - ip link set eth1 mtu 1500
      - ip route add 192.168.0.0/16 via 203.0.113.1
  links:
    - endpoints: ["PC1:eth1", "FGT1:port2"]
    - endpoints: ["FGT1:port3", "WEB1:eth1"]
