hostname ISP
!
interface Ethernet0/1
 description AS65010 EDGE1 primary
 ip address 198.51.100.1 255.255.255.252
 no shutdown
!
interface Ethernet0/2
 description AS65010 EDGE2 backup
 ip address 198.51.100.5 255.255.255.252
 no shutdown
!
interface Ethernet0/3
 description Internet segment
 ip address 203.0.113.1 255.255.255.0
 no shutdown
!
router bgp 64500
 bgp router-id 192.0.2.1
 bgp log-neighbor-changes
 neighbor 198.51.100.2 remote-as 65010
 neighbor 198.51.100.2 description CUST-BRANCH primary
 neighbor 198.51.100.2 default-originate
 neighbor 198.51.100.6 remote-as 65010
 neighbor 198.51.100.6 description CUST-BRANCH backup
 neighbor 198.51.100.6 default-originate
!
end
