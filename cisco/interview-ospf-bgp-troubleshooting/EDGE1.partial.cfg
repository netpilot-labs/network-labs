hostname EDGE1
!
interface Ethernet0/1
 description to CORE Et0/2
 ip address 10.0.1.2 255.255.255.252
 ip ospf network point-to-point
 ip ospf hello-interval 5
 no shutdown
!
interface Ethernet0/2
 description ISP primary circuit
 ip address 198.51.100.2 255.255.255.252
 no shutdown
!
ip prefix-list BRANCH-NETS seq 5 permit 10.10.0.0/16 le 24
!
route-map TO-ISP permit 10
 match ip address prefix-list BRANCH-NETS
 set metric 50
route-map TO-ISP permit 20
!
router ospf 1
 router-id 10.10.255.2
 network 10.0.1.0 0.0.0.3 area 0
 default-information originate metric 10
!
router bgp 65010
 bgp router-id 10.10.255.2
 bgp log-neighbor-changes
 network 10.10.10.0 mask 255.255.255.0
 neighbor 198.51.100.1 remote-as 64500
 neighbor 198.51.100.1 description ISP primary
 neighbor 198.51.100.1 route-map TO-ISP out
!
end
