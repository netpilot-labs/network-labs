hostname EDGE2
!
interface Ethernet0/1
 description to CORE Et0/3
 ip address 10.0.2.2 255.255.255.252
 ip ospf network point-to-point
 no shutdown
!
interface Ethernet0/2
 description ISP backup circuit
 ip address 198.51.100.6 255.255.255.252
 no shutdown
!
ip prefix-list BRANCH-NETS seq 5 permit 10.10.0.0/16
!
route-map TO-ISP permit 10
 match ip address prefix-list BRANCH-NETS
 set metric 200
route-map TO-ISP permit 20
!
router ospf 1
 router-id 10.10.255.3
 network 10.0.2.0 0.0.0.3 area 0
 default-information originate metric 100
!
router bgp 65010
 bgp router-id 10.10.255.3
 bgp log-neighbor-changes
 network 10.10.0.0 mask 255.255.0.0
 neighbor 198.51.100.5 remote-as 64500
 neighbor 198.51.100.5 description ISP backup
 neighbor 198.51.100.5 route-map TO-ISP out
!
end
